<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام در سایت</title>
    <link rel="icon"  type="image/png" href="alaf.png">

    <style>
    * {
    padding: 0;
    margin: 0;
    border: none;
    outline: none;
    font-family: Dana;
    font-size: 18px;
    box-sizing: border-box;
}
body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background-color: #00BB8C;
}
form{
    background-color: #fff;
    border-radius: 12px;
    padding: 20px 28px;
    width: 400px;
}
input[type="text"],
input[type="email"],
input[type="password"]{
    width: 100%;
    border: 1px solid #ded9ee;
    padding: 16px;
    border-radius: 8px;
    color: #1b1b1b;
    display: block;
    transition: 180ms ease-in border-color;
}
input::placeholder{
    color: grey;
    font-weight: 300;
}
input:focus{
    border-color: #89888b;
}
button[type="submit"],
input[type="submit"]{
    background-color: #2ed573;
    color: white;
    padding: 12px;
    border-radius: 8px;
    display: block;
    cursor: pointer;
    width: 100%;
}
img{
    display: block;
    width: 110px;
    margin: 0 auto;
}
    </style>
    
</head>


<body>
    <form style="height: 500px;">
        <img src="/logo.png" alt="لوگوی سبز لرن">
        <br>
        <input type="text" placeholder="نام مستعار" required  autofocus name="name">
        <br>
        <input type="email" placeholder="ایمیل" name="email" required>
        <br>
        <input type="password" name="password" placeholder="رمز عبور" required>
        <br>
        <input type="password" name="repeate_password" placeholder="تکرار رمز عبور" required>
        <br>

        <input type="checkbox" id="ghavanin"  name="ghavanin" required >
        <label for="ghavanin" > قوانین و شرایط  سایت <a href="" style="color: blue;"> سبز لرن</a> را میپذیرم</label>
        <br>
        <br>
        <input type="submit" value="ثبت نام">
        
    
</body>
    
</html>
